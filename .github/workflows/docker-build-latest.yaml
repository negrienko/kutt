# Builds branch main into r.tulz.dev as :latest.
# See docker-build-release.yaml for why this diverges from upstream.
name: docker-build-latest

on:
  push:
    branches:
      - main

jobs:
  registry-build-push:
    name: Build and push to r.tulz.dev
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to registry
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.REGISTRY_HOST }}/${{ github.repository }}:latest
          cache-from: type=registry,ref=${{ secrets.REGISTRY_HOST }}/${{ github.repository }}:latest
          build-args: |
            BUILDKIT_INLINE_CACHE=1
